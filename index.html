<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        p {
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a.btn {
            display: block;
            background: #222;
            color: #fff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        a.btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мое Портфолио</h1>
        <p>Добро пожаловать на мой сайт!</p>
        <div class="links">
            <a href="#" class="btn">Обо мне</a>
            <a href="#" class="btn">Мои проекты</a>
            <a href="#" class="btn">Контакты</a>
        </div>
    </div>
</body>
</html>
